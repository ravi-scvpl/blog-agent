<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Blog Agent - Premium Content Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.1);
            --accent: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .input-group {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
            border-color: rgba(139, 92, 246, 0.3);
        }

        input[type="text"] {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
            padding: 0.5rem;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #downloadBtn {
            background: var(--accent);
            display: none;
            margin: 0 auto 2rem;
        }

        #downloadBtn:hover {
            background: #0ea5e9;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .result-panel {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            animation: fadeIn 0.5s ease;
            position: relative;
        }

        .seo-meta {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid var(--primary);
        }

        .seo-meta strong {
            color: var(--accent);
            display: block;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .seo-meta p {
            margin-bottom: 1rem;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        
        .seo-meta p:last-child {
            margin-bottom: 0;
        }

        .blog-content h1 {
            font-size: 2.5rem;
            background: none;
            -webkit-text-fill-color: var(--text-main);
            color: var(--text-main);
            margin: 2rem 0 1rem;
        }

        .blog-content h2 {
            font-size: 1.8rem;
            margin: 2rem 0 1rem;
            color: #e2e8f0;
        }
        
        .blog-content h3 {
            font-size: 1.4rem;
            margin: 1.5rem 0 1rem;
            color: #e2e8f0;
        }

        .blog-content p, .blog-content ul, .blog-content ol {
            margin-bottom: 1.2rem;
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        .blog-content ul {
            padding-left: 2rem;
        }

        .loader {
            display: none;
            flex-direction: column;
            align-items: center;
            margin: 3rem 0;
            color: var(--text-muted);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139, 92, 246, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 1rem;
        }

        .status-text {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            animation: pulseText 1.5s infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Blog Agent</h1>
            <p>Generate highly structured, SEO-optimized content in seconds.</p>
        </header>

        <div class="input-group">
            <div class="input-stack" style="flex-grow: 1; display: flex; flex-direction: column; gap: 0.75rem;">
                <input type="text" id="topicInput" placeholder="Enter a topic (e.g. The Future of AI in Web Development)" autocomplete="off" />
                <input type="text" id="keywordsInput" placeholder="Enter keywords (optional, comma separated)" autocomplete="off" style="font-size: 0.9rem; opacity: 0.8; border-top: 1px solid var(--border-color); padding-top: 0.75rem;" />
            </div>
            <button id="generateBtn" onclick="generateBlog()">
                Generate
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>

        <button id="downloadBtn" onclick="downloadWord()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download as Word (.doc)
        </button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">Brewing your content... (This might take a minute)</div>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="seo-meta" id="seoMeta">
                <!-- Injected via JS -->
            </div>
            <div class="blog-content" id="blogContent">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script>
        let currentRawHTML = "";
        let currentTitle = "Generated_Blog";

        async function generateBlog() {
            const topic = document.getElementById('topicInput').value.trim();
            const keywords = document.getElementById('keywordsInput').value.trim();
            if (!topic) return;

            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const resultPanel = document.getElementById('resultPanel');
            const downloadBtn = document.getElementById('downloadBtn');

            // UI Reset
            btn.disabled = true;
            resultPanel.style.display = 'none';
            downloadBtn.style.display = 'none';
            loader.style.display = 'flex';
            document.getElementById('statusText').innerText = "Agents are researching & writing... (This takes about 1-2 minutes)";

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, userKeywords: keywords })
                });

                if (!response.ok) {
                    throw new Error("Failed to generate content.");
                }

                const data = await response.json();
                
                // Parse markdown
                currentRawHTML = marked.parse(data.finalBlog);
                currentTitle = data.slug || "generated_blog";

                // Populate UI
                document.getElementById('seoMeta').innerHTML = `
                    <strong>Meta Title</strong>
                    <p>${data.metaTitle}</p>
                    <strong>Meta Description</strong>
                    <p>${data.metaDescription}</p>
                    <strong>URL Slug</strong>
                    <p>/${data.slug}</p>
                `;
                
                document.getElementById('blogContent').innerHTML = currentRawHTML;

                loader.style.display = 'none';
                resultPanel.style.display = 'block';
                downloadBtn.style.display = 'flex';

            } catch (error) {
                alert("Something went wrong! Error: " + error.message);
                loader.style.display = 'none';
            } finally {
                btn.disabled = false;
            }
        }

        // Handle Enter key
        document.getElementById('topicInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                generateBlog();
            }
        });

        // Export to Word Document
        function downloadWord() {
            if (!currentRawHTML) return;

            // Simple MS-Word HTML format encapsulation
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                "xmlns='http://www.w3.org/TR/REC-html40'>" +
                "<head><meta charset='utf-8'><title>" + currentTitle + "</title>" +
                "<style>" +
                "body { font-family: 'Calibri', sans-serif; line-height: 1.6; color: #333; }" +
                "h1, h2, h3 { color: #111; } h1 { font-size: 26pt; } h2 { font-size: 20pt; }" +
                "</style>" +
                "</head><body>";
            
            const footer = "</body></html>";
            
            // Reconstruct full HTML body
            const sourceHTML = header + currentRawHTML + footer;
            
            // Build Blog Blob
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            
            // Initiate Download Flow
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = currentTitle + '.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }
    </script>
</body>
</html>
